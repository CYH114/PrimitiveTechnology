// Add any additional repositories for your dependencies here.

repositories {
    // 背景：gregtech.overminddl1.com 在部分网络环境下 TLS 握手会被 Gradle 的 HTTP 客户端中断
    // （Could not GET .../Thaumcraft-1.7.10-4.2.3.5.pom > Remote host terminated the handshake），
    // 而 curl/普通 Java 直连正常；GTNH Nexus 也没有这个坐标。
    // 处理：本地放了 libs/maven 镜像（已被 .gitignore 忽略）时，thaumcraft 组只从镜像解析；
    //       镜像不存在时（例如 GitHub Actions 上），自动回退到线上仓库，不影响 CI。
    // 镜像目录 libs/maven/thaumcraft/Thaumcraft/1.7.10-4.2.3.5/ 内应有：
    //   Thaumcraft-1.7.10-4.2.3.5.pom
    //   Thaumcraft-1.7.10-4.2.3.5.jar
    //   Thaumcraft-1.7.10-4.2.3.5-dev.jar
    def mirrorDir = file("${rootProject.projectDir}/libs/maven/thaumcraft/Thaumcraft/1.7.10-4.2.3.5")
    def mirrorReady = new File(mirrorDir, 'Thaumcraft-1.7.10-4.2.3.5.pom').isFile() &&
        new File(mirrorDir, 'Thaumcraft-1.7.10-4.2.3.5-dev.jar').isFile()

    if (mirrorReady) {
        logger.lifecycle("[repositories.gradle] Using local Thaumcraft mirror: ${mirrorDir}")
        exclusiveContent {
            forRepository {
                maven {
                    name = 'LocalThaumcraftMirror'
                    url = uri("${rootProject.projectDir}/libs/maven")
                }
            }
            filter {
                includeGroup('thaumcraft')
            }
        }
    } else {
        logger.lifecycle("[repositories.gradle] Local Thaumcraft mirror not found, falling back to remote repositories")
    }
}
